<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cleveland Museum of Art</title>

  <!-- Φορτώνουμε γραμματοσειρές από το Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---- Μεταβλητές χρωμάτων ---- */
    :root {
      --bg:      #f5f0e8;
      --surface: #ffffff;
      --accent:  #8b2020;
      --accent2: #c0392b;
      --text:    #1a1a1a;
      --muted:   #6b6b6b;
      --border:  #ddd5c4;
    }

    /* ---- Βασικό reset ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ---- Κεφαλίδα ---- */
    header {
      background-color: var(--accent);
      color: white;
      padding: 40px 20px 30px;
      text-align: center;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      letter-spacing: 2px;
    }
    header p { margin-top: 8px; font-size: 1rem; opacity: 0.85; }

    /* ---- Κεντρικό container ---- */
    main { max-width: 960px; margin: 0 auto; padding: 40px 20px; }

    /* ---- Τίτλοι ενοτήτων ---- */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--accent);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    /* ---- Μήνυμα φόρτωσης ---- */
    .loading { color: var(--muted); font-style: italic; padding: 10px 0; }

    /* ---- Πίνακας τμημάτων ---- */
    #departments-section { margin-bottom: 50px; }

    #dept-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    #dept-table th {
      background-color: var(--accent);
      color: white;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
    }
    #dept-table td { padding: 10px 16px; border-bottom: 1px solid var(--border); }
    #dept-table tr:nth-child(even) td { background-color: #faf6f0; }

    /* ---- Grid καρτών έργων ---- */
    #artworks-section { margin-bottom: 50px; }

    #artworks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* ---- Κάρτα έργου ---- */
    .artwork-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .artwork-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .artwork-info { padding: 14px 16px; }
    .artwork-title { font-family: 'Playfair Display', serif; font-size: 1rem; margin-bottom: 4px; }
    .artwork-creator { font-size: 0.875rem; color: var(--muted); margin-bottom: 12px; }

    /* ---- Κουμπί εμφάνισης εικόνας ---- */
    .btn-show-image {
      display: inline-block;
      padding: 7px 16px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Source Sans 3', sans-serif;
      transition: background-color 0.2s;
    }
    .btn-show-image:hover { background-color: var(--accent2); }

    /*
      Η εικόνα είναι ΚΡΥΜΜΕΝΗ αρχικά (display: none).
      Όταν πατηθεί το κουμπί, η JavaScript αλλάζει σε display: block.
    */
    .artwork-image {
      display: none;
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }

    /* Μήνυμα "Δεν υπάρχει εικόνα" για έργα χωρίς εικόνα */
    .no-image-msg {
      display: none;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      padding: 4px 0;
    }

    /* ---- Footer ---- */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); }
  </style>
</head>

<body>

  <!-- ========================
    ΚΕΦΑΛΙΔΑ: Όνομα μουσείου
  ========================= -->
  <header>
    <h1>Cleveland Museum of Art</h1>
    <p>Συλλογή Έργων Τέχνης — Ανοιχτή Πρόσβαση API</p>
  </header>

  <main>

    <!-- ========================
      ΕΝΟΤΗΤΑ 1: Πίνακας Τμημάτων
    ========================= -->
    <section id="departments-section">
      <h2 class="section-title">Τμήματα Μουσείου</h2>
      <table id="dept-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Όνομα Τμήματος</th>
          </tr>
        </thead>
        <!-- Το <tbody> θα γεμίσει από την JavaScript -->
        <tbody id="dept-body">
          <tr><td colspan="2" class="loading">Φόρτωση τμημάτων...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- ========================
      ΕΝΟΤΗΤΑ 2: Έργα Τέχνης
    ========================= -->
    <section id="artworks-section">
      <h2 class="section-title">10 Έργα Τέχνης από τη Συλλογή</h2>
      <!-- Το grid θα γεμίσει από την JavaScript -->
      <div id="artworks-grid">
        <p class="loading">Φόρτωση έργων τέχνης...</p>
      </div>
    </section>

  </main>

  <footer>
    <p>Δεδομένα από το <a href="https://openaccess-api.clevelandart.org/" target="_blank">Cleveland Museum of Art Open Access API</a></p>
  </footer>


  <!-- ========================
    JAVASCRIPT
  ========================= -->
  <script>

    // ==================================================
    // ΒΗΜΑ 1: URLs (endpoints) του API
    // ==================================================

    // Endpoint για έργα τέχνης:
    // - has_image=1  → μόνο έργα που έχουν εικόνα
    // - cc0=1        → μόνο δημόσια domain (επιτρέπεται η εμφάνισή τους)
    // - limit=20     → ζητάμε 20 για να έχουμε αρκετά αφού θα φιλτράρουμε στη JS
    var ARTWORKS_URL = "https://openaccess-api.clevelandart.org/api/artworks/?has_image=1&cc0=1&limit=20";

    // Τα τμήματα του μουσείου — αυτά προέρχονται από το Appendix B
    // της επίσημης τεκμηρίωσης του API (openaccess-api.clevelandart.org)
    // Δεν υπάρχει ξεχωριστό endpoint για departments, οπότε τα ορίζουμε
    // ως στατικό πίνακα (array) απευθείας στον κώδικα.
    var DEPARTMENTS = [
      "African Art",
      "American Painting and Sculpture",
      "Art of the Americas",
      "Chinese Art",
      "Contemporary Art",
      "Decorative Art and Design",
      "Drawings",
      "Egyptian and Ancient Near Eastern Art",
      "European Painting and Sculpture",
      "Greek and Roman Art",
      "Indian and South East Asian Art",
      "Islamic Art",
      "Japanese Art",
      "Korean Art",
      "Medieval Art",
      "Modern European Painting and Sculpture",
      "Oceania",
      "Performing Arts, Music, & Film",
      "Photography",
      "Prints",
      "Textiles"
    ];


    // ==================================================
    // ΒΗΜΑ 2: Εμφάνιση Τμημάτων από τον στατικό πίνακα
    // ==================================================

    function loadDepartments() {

      var tbody = document.getElementById("dept-body");
      tbody.innerHTML = ""; // αφαιρούμε το "Φόρτωση..."

      // Επανάληψη: για κάθε τμήμα στον πίνακα DEPARTMENTS
      // δημιουργούμε μια γραμμή <tr> στον HTML πίνακα
      for (var i = 0; i < DEPARTMENTS.length; i++) {

        var row = document.createElement("tr");
        // i+1 γιατί το i ξεκινά από 0 αλλά θέλουμε αρίθμηση από 1
        row.innerHTML = "<td>" + (i + 1) + "</td><td>" + DEPARTMENTS[i] + "</td>";

        tbody.appendChild(row); // προσθέτουμε τη γραμμή στον πίνακα
      }
    }


    // ==================================================
    // ΒΗΜΑ 3: Φόρτωση Έργων Τέχνης
    // ==================================================

    function loadArtworks() {

      fetch(ARTWORKS_URL)

        .then(function(response) {
          return response.json();
        })

        .then(function(data) {

          var grid = document.getElementById("artworks-grid");
          grid.innerHTML = ""; // αφαιρούμε το "Φόρτωση..."

          var allArtworks = data.data; // όλα τα έργα που ήρθαν (έως 20)

          // --- Φιλτράρισμα: κρατάμε ΜΟΝΟ έργα με έγκυρο URL εικόνας ---
          // Αυτό λύνει το πρόβλημα με τις εικόνες που δεν φόρτωναν!
          // Ορισμένα έργα έχουν has_image=1 στο API αλλά το images.web.url λείπει.
          var artworksWithImages = [];

          for (var i = 0; i < allArtworks.length; i++) {
            var a = allArtworks[i];

            // Ελέγχουμε αν υπάρχει το images.web.url βήμα-βήμα
            // για να αποφύγουμε σφάλμα "Cannot read property of undefined"
            if (a.images && a.images.web && a.images.web.url && a.images.web.url !== "") {
              artworksWithImages.push(a); // το κρατάμε
            }

            // Μόλις μαζέψουμε 10, σταματάμε
            if (artworksWithImages.length === 10) break;
          }

          // --- Δημιουργία κάρτας για κάθε έργο ---
          for (var j = 0; j < artworksWithImages.length; j++) {
            var artwork = artworksWithImages[j];

            // Τίτλος
            var title = artwork.title || "Χωρίς τίτλο";

            // Δημιουργός: βρίσκεται στο creators[0].description
            var creator = "Άγνωστος δημιουργός";
            if (artwork.creators && artwork.creators.length > 0) {
              creator = artwork.creators[0].description;
            }

            // URL εικόνας (έχουμε ήδη επαληθεύσει ότι υπάρχει)
            var imageUrl = artwork.images.web.url;

            // --- Δημιουργία κάρτας (div) ---
            var card = document.createElement("div");
            card.className = "artwork-card";

            // Γεμίζουμε το HTML της κάρτας
            card.innerHTML =
              "<div class='artwork-info'>" +
                "<div class='artwork-title'>" + title + "</div>" +
                "<div class='artwork-creator'>" + creator + "</div>" +
                "<button class='btn-show-image'>🖼 Εμφάνισε Εικόνα</button>" +
              "</div>" +
              // Η εικόνα — αρχικά κρυμμένη (display:none από το CSS)
              "<img class='artwork-image' src='" + imageUrl + "' alt='" + title + "' />";

            // --- Event Listener: όταν πατηθεί το κουμπί ---
            var btn = card.querySelector(".btn-show-image");
            var img = card.querySelector(".artwork-image");

            // Χρησιμοποιούμε closure για να "κλειδώσουμε" τις μεταβλητές btn/img
            // σε κάθε κάρτα ξεχωριστά
            (function(b, im) {
              b.addEventListener("click", function() {
                if (im.style.display === "block") {
                  // Κρύψε εικόνα
                  im.style.display = "none";
                  b.textContent = "🖼 Εμφάνισε Εικόνα";
                } else {
                  // Δείξε εικόνα
                  im.style.display = "block";
                  b.textContent = "✕ Κλείσε Εικόνα";
                }
              });
            })(btn, img); // IIFE: εκτελείται αμέσως με τα τρέχοντα btn/img

            grid.appendChild(card); // προσθέτουμε την κάρτα στο grid
          }

          // Αν δεν βρέθηκαν αρκετά έργα με εικόνα:
          if (artworksWithImages.length === 0) {
            grid.innerHTML = "<p>Δεν βρέθηκαν έργα με διαθέσιμη εικόνα αυτή τη στιγμή.</p>";
          }
        })

        .catch(function(error) {
          document.getElementById("artworks-grid").innerHTML =
            "<p>Σφάλμα φόρτωσης έργων τέχνης. Ελέγξτε τη σύνδεσή σας.</p>";
          console.error("Σφάλμα artworks:", error);
        });
    }


    // ==================================================
    // ΒΗΜΑ 4: Εκκίνηση — καλούμε τις συναρτήσεις
    // ==================================================

    loadDepartments();
    loadArtworks();

  </script>

</body>
</html>
